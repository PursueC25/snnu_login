# ============================================
# SNNU 校园网自动登录 - 配置模板
# 用法：把本文件复制一份，重命名为 config.ini，再填写你的信息
# ============================================

[User]
# 【必填】校园网账号（学号）
account = 你的学号

# 【必填】校园网密码
password = 你的密码

[Network]
# 【选填】代拨运营商选择
# 留空 = 使用校园网（无需选择代拨，直接登录）
# 填写以下值之一：
#   mobile  - 移动代拨
#   unicom  - 联通代拨
#   telecom - 电信代拨
provider = mobile

# 校园网登录地址（一般不需要改）
# 8601 / 8602 是同一套门户的两个端口，主端口不通时会自动切换另一个
base_url = http://202.117.144.205:8602/snnuportal

[WiFi]
# 【Wi-Fi 自动连接】断网后 Wi-Fi 没自动连上校园网时，自动连一下再认证
#   true  - 开启（推荐）
#   false - 关闭，只做认证、不碰 Wi-Fi
enabled = true

# 校园网 Wi-Fi 名称，多个用英文逗号分隔（按优先级尝试）
ssid = SNNU

# 指定无线网卡名称，留空 = 自动（netsh wlan show interfaces 里"名称"那一行）
interface =

# 已经连着别的 Wi-Fi（比如手机热点）时，是否强制切回校园网
#   false - 不干预（推荐，避免把你正在用的网切掉）
#   true  - 只要门户不通就切回校园网
auto_switch = false

# 连上 Wi-Fi 后最多等多少秒让它拿到 IP、门户可达
wait_after_connect = 20

[Settings]
# 【接口版】单次请求超时时间（秒）
timeout = 8

# 【接口版】登录失败后的重试次数
retries = 3

# 【接口版】接口登录失败时，是否自动回退到浏览器版 auto_login_selenium.py
#   true  - 回退（推荐，过渡期更稳）
#   false - 不回退
fallback_selenium = true

# 【浏览器版兜底用】浏览器设置
#   true  - 无头模式（不显示浏览器窗口）
#   false - 显示浏览器窗口（调试用）
headless = true

# 浏览器类型：edge 或 chrome
browser = edge

# 日志清理设置
# 日志文件超过此天数自动清空（单位：日），默认30天
log_cleanup_days = 30
