# ============================================
# SNNU 校园网自动登录 - 配置模板
# 用法：把本文件复制一份，重命名为 config.ini，再填写你的信息
#      （Windows 下直接双击 snnu_login.exe 也可以，向导会自动生成 config.ini）
# ============================================

[User]
# 【必填】校园网账号（学号）
account = 你的学号

# 【必填】校园网密码（只保存在本机 config.ini，该文件已被 .gitignore 排除）
password = 你的密码

[Network]
# 【选填】代拨运营商选择
# 留空 = 使用校园网（无需选择代拨，直接登录）
# 填写以下值之一：
#   mobile  - 移动代拨
#   unicom  - 联通代拨
#   telecom - 电信代拨
provider = mobile

# 校园网登录地址（一般不需要改）
# 8601 / 8602 是同一套门户的两个端口，主端口不通时会自动切换另一个
base_url = http://202.117.144.205:8602/snnuportal

[WiFi]
# 【Wi-Fi 自动连接】断网后 Wi-Fi 没自动连上校园网时，自动连一下再认证
#   true  - 开启（推荐）
#   false - 关闭，只做认证、不碰 Wi-Fi
enabled = true

# 校园网 Wi-Fi 名称，多个用英文逗号分隔（按优先级尝试）
ssid = SNNU

# 指定无线网卡名称，留空 = 自动（netsh wlan show interfaces 里"名称"那一行）
interface =

# 已经连着别的 Wi-Fi（比如手机热点）时，是否强制切回校园网
#   false - 不干预（推荐，避免把你正在用的网切掉）
#   true  - 只要门户不通就切回校园网
auto_switch = false

# 连上 Wi-Fi 后最多等多少秒让它拿到 IP、门户可达
wait_after_connect = 20

[Settings]
# 单次请求超时时间（秒）
timeout = 8

# 登录失败后的重试次数
retries = 3

# 说明：运行日志 auto_login.log 超过 5000 行会自动精简，不需要配置项
